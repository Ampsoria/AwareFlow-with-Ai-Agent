[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "awareflow"
version = "0.1.0"
description = "Security awareness workflow core and deterministic demo"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.10,<3", "fpdf2>=2.8,<3", "uharfbuzz>=0.39", "pythainlp>=5,<6", "streamlit>=1.50,<2", "openai>=1.68,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
qa = ["pypdf>=5", "pypdfium2>=4"]

[project.scripts]
awareflow = "awareflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
